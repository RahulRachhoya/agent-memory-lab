[project]
name = "agent-memory-lab"
version = "0.1.0"
description = "MongoDB memory and telemetry for a LangGraph agent, plus a Qdrant vs pgvector hybrid-retrieval benchmark"
readme = "README.md"
authors = [
    { name = "Rahul Rachhoya", email = "rahulrachhoya0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastembed>=0.8.1",
    "langchain-aws>=1.7.9",
    "langchain-core>=1.6.4",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-mongodb>=0.5.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pymongo>=4.17.0",
    "qdrant-client>=1.19.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
